<!DOCTYPE html>
<html lang="en" data-theme="dark" data-perf="balanced">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>BOOSTER OS — Premium Music</title>
<meta name="theme-color" content="#0a0a0f">
<style>
/* =========================================================
   BOOSTER OS — CSS TOKENS
========================================================= */
:root{
  --bg:#0a0a0f;
  --bg-2:#0d0d14;
  --surface: rgba(255,255,255,0.045);
  --surface-2: rgba(255,255,255,0.07);
  --surface-glass: rgba(255,255,255,0.06);
  --text:#f2f2f5;
  --text-muted:rgba(242,242,245,0.58);
  --text-dim:rgba(242,242,245,0.36);
  --accent:#7c8bff;
  --accent-rgb:124,139,255;
  --accent-2:#c98bff;
  --border: rgba(255,255,255,0.09);
  --border-soft: rgba(255,255,255,0.05);
  --radius-s:10px;
  --radius:16px;
  --radius-l:22px;
  --radius-xl:28px;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 8px 24px rgba(0,0,0,.35);
  --shadow-3: 0 20px 60px rgba(0,0,0,.45);
  --blur-lo: 10px;
  --blur-hi: 28px;
  --ease: cubic-bezier(.22,.9,.32,1);
  --dur-fast: .16s;
  --dur: .32s;
  --dur-slow: .6s;
  --safe-t: env(safe-area-inset-top);
  --safe-b: env(safe-area-inset-bottom);
  --safe-l: env(safe-area-inset-left);
  --safe-r: env(safe-area-inset-right);
  --ambient-1: 124,139,255;
  --ambient-2: 201,139,255;
  --ambient-3: 10,10,15;
}
[data-theme="light"]{
  --bg:#f4f4f7;
  --bg-2:#eceef2;
  --surface: rgba(20,20,30,0.04);
  --surface-2: rgba(20,20,30,0.07);
  --surface-glass: rgba(255,255,255,0.55);
  --text:#15151c;
  --text-muted:rgba(21,21,28,0.6);
  --text-dim:rgba(21,21,28,0.4);
  --border: rgba(20,20,30,0.09);
  --border-soft: rgba(20,20,30,0.05);
  --shadow-1: 0 1px 2px rgba(0,0,0,.08);
  --shadow-2: 0 8px 24px rgba(0,0,0,.10);
  --shadow-3: 0 20px 50px rgba(0,0,0,.14);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{
  font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow:hidden; height:100vh; width:100vw;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; color:inherit; background:none; border:none; cursor:pointer;}
img{max-width:100%; display:block;}
a{color:inherit;text-decoration:none;}
::selection{background:rgba(var(--accent-rgb),.35);}
[data-perf="battery"] .glass, [data-perf="battery"] .glass-strong{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
[data-perf="battery"] .reflection, [data-perf="battery"] .breathe, [data-perf="battery"] .visualizer-canvas{display:none!important;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; transition-duration:.001ms!important;} }

/* Glass material */
.glass{
  background: var(--surface-glass);
  backdrop-filter: blur(var(--blur-lo)) saturate(140%);
  -webkit-backdrop-filter: blur(var(--blur-lo)) saturate(140%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-1), inset 0 1px 0 rgba(255,255,255,.04);
}
.glass-strong{
  position:relative;
  background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
  backdrop-filter: blur(var(--blur-hi)) saturate(160%);
  -webkit-backdrop-filter: blur(var(--blur-hi)) saturate(160%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.08);
}
[data-theme="light"] .glass-strong{
  background: linear-gradient(160deg, rgba(255,255,255,0.75), rgba(255,255,255,0.35));
}
.glass-strong::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.10) 45%, transparent 60%);
  opacity:.6; mix-blend-mode:overlay;
}
.reflection{
  position:absolute; inset:0; border-radius:inherit; pointer-events:none; overflow:hidden;
}
.reflection::after{
  content:""; position:absolute; top:-40%; left:-60%; width:60%; height:220%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.10), transparent);
  transform: rotate(8deg);
  animation: sheen 9s linear infinite;
}
@keyframes sheen{ 0%{ left:-60%; } 100%{ left:140%; } }

/* Ambient background */
#ambient{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1200px 800px at 15% -10%, rgba(var(--ambient-1),.20), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(var(--ambient-2),.14), transparent 55%),
    var(--bg);
  transition: background 1.1s var(--ease);
}

/* App shell layout */
#appShell{position:relative; z-index:1; height:100vh; width:100vw; display:flex;}
.sidebar{
  display:none; flex-direction:column; width:240px; padding:20px 14px; gap:4px;
  border-right:1px solid var(--border-soft);
}
.brand{font-weight:800; font-size:18px; letter-spacing:.3px; padding:10px 12px 22px;}
.brand b{color:var(--accent);}
.navitem{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-s);
  font-size:14.5px; font-weight:600; color:var(--text-muted); text-align:left;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.navitem:hover{background:var(--surface);}
.navitem.active{background:var(--surface-2); color:var(--text);}
.sidebar-footer{margin-top:auto; font-size:11px; color:var(--text-dim); padding:12px;}

.main-view{flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; position:relative;}
.topbar{
  display:flex; align-items:center; gap:10px; padding: calc(var(--safe-t) + 12px) 16px 10px;
  flex-shrink:0;
}
#topbarTitle{font-weight:800; font-size:19px;}
.iconbtn{
  width:40px;height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:18px; color:var(--text); transition: background var(--dur-fast), transform var(--dur-fast);
  flex-shrink:0;
}
.iconbtn:hover{background:var(--surface);}
.iconbtn:active{transform:scale(.9);}
.iconbtn.small{width:34px;height:34px;font-size:15px;}
.offline-pill{
  margin-left:auto; font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;
  background:rgba(255,180,80,.15); color:#ffb450; border:1px solid rgba(255,180,80,.25);
}
.view-container{
  flex:1; overflow-y:auto; overflow-x:hidden; padding: 4px 16px calc(96px + var(--safe-b));
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
}
@media (min-width:900px){
  .sidebar{display:flex;}
  .view-container{padding-bottom: calc(100px + var(--safe-b));}
}

/* Section headings & rows */
.section{margin:18px 0 26px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.section-title{font-size:17px; font-weight:800;}
.section-link{font-size:12.5px; color:var(--text-muted); font-weight:600;}
.hscroll{display:flex; gap:14px; overflow-x:auto; overflow-y:hidden; padding-bottom:6px; scroll-snap-type:x proximity;}
.hscroll::-webkit-scrollbar{display:none;}
.card{
  flex-shrink:0; width:150px; scroll-snap-align:start; cursor:pointer;
  transition: transform var(--dur-fast) var(--ease);
}
.card:active{transform:scale(.97);}
.card .art{
  width:150px;height:150px;border-radius:var(--radius); overflow:hidden; background:var(--surface-2);
  box-shadow: var(--shadow-1); position:relative;
}
.card .art img{width:100%;height:100%;object-fit:cover;}
.card .ct{font-size:13px; font-weight:700; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card .cs{font-size:11.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card.round .art{border-radius:50%;}

.continue-card{
  flex-shrink:0; width:230px; display:flex; align-items:center; gap:10px; padding:8px; border-radius:var(--radius);
  background:var(--surface); scroll-snap-align:start; cursor:pointer;
}
.continue-card img{width:52px;height:52px;border-radius:8px;object-fit:cover; flex-shrink:0;}
.continue-card .ct{font-size:13px;font-weight:700; overflow:hidden;text-overflow:ellipsis; white-space:nowrap;}
.continue-card .cs{font-size:11.5px;color:var(--text-muted); overflow:hidden;text-overflow:ellipsis; white-space:nowrap;}

.row-list{display:flex; flex-direction:column;}
.row-item{
  display:flex; align-items:center; gap:12px; padding:9px 6px; border-radius:var(--radius-s); cursor:pointer;
  transition: background var(--dur-fast);
}
.row-item:hover{background:var(--surface);}
.row-item.playing{background:rgba(var(--accent-rgb),.08);}
.row-item img{width:46px;height:46px;border-radius:8px;object-fit:cover; flex-shrink:0; background:var(--surface-2);}
.row-item .meta{flex:1; min-width:0;}
.row-item .t{font-size:14px;font-weight:700; white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-item .a{font-size:12px;color:var(--text-muted); white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-item .autoplay-tag{font-size:9px; font-weight:800; letter-spacing:.5px; color:var(--accent); border:1px solid rgba(var(--accent-rgb),.35); padding:2px 5px; border-radius:5px; margin-left:6px; flex-shrink:0;}
.row-item .actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}

.empty-state{padding:40px 20px; text-align:center; color:var(--text-muted); font-size:14px;}
.skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 37%,var(--surface) 63%); background-size:400% 100%; animation: shimmer 1.4s ease infinite; border-radius:var(--radius);}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
[data-perf="battery"] .skeleton{animation:none;}

/* Search */
.search-bar{
  display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:999px;
  background:var(--surface); border:1px solid var(--border-soft); margin-bottom:14px;
}
.search-bar input{
  flex:1; border:none; background:none; outline:none; color:var(--text); font-size:15px; min-width:0;
}
.chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chip{padding:7px 13px; border-radius:999px; background:var(--surface); font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer;}
.chip.active{background:rgba(var(--accent-rgb),.18); color:var(--accent);}

/* Mini Player */
.mini-player{
  position:fixed; left:10px; right:10px; bottom: calc(66px + var(--safe-b));
  height:60px; border-radius:var(--radius-l); display:flex; align-items:center; gap:10px; padding:0 8px 0 6px;
  z-index:50; cursor:pointer; overflow:hidden;
  transition: transform var(--dur) var(--ease), opacity var(--dur);
}
@media (min-width:900px){
  .mini-player{left:16px; right:16px; bottom:16px; height:64px;}
}
.mini-progress{position:absolute; left:0; right:0; top:0; height:2.5px; background:rgba(255,255,255,.08);}
.mini-progress-fill{height:100%; width:0%; background:var(--accent); transition:width .1s linear;}
.mini-art{width:44px;height:44px;border-radius:10px;object-fit:cover; flex-shrink:0; box-shadow:var(--shadow-1);}
.mini-meta{flex:1; min-width:0;}
.mini-title{font-size:13.5px;font-weight:800; white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-artist{font-size:11.5px;color:var(--text-muted); white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-player .play{background:var(--accent); color:#fff; width:38px;height:38px;}

/* Bottom Nav */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; height: calc(58px + var(--safe-b)); padding-bottom:var(--safe-b);
  display:flex; z-index:40; border-radius:0;
}
.bottom-nav .navitem{flex:1; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:0; font-size:10.5px;}
.bottom-nav .navitem .ic{font-size:19px;}
@media (min-width:900px){ .bottom-nav{display:none;} }

/* Full Player */
.full-player{
  position:fixed; inset:0; z-index:200; display:flex; flex-direction:column;
  background: linear-gradient(180deg, rgba(var(--ambient-1),.18), var(--bg) 55%);
  transform: translateY(100%); transition: transform var(--dur-slow) var(--ease);
  padding: calc(var(--safe-t) + 10px) 0 calc(var(--safe-b) + 10px);
}
.full-player.open{transform:translateY(0);}
.fp-head{display:flex; align-items:center; justify-content:space-between; padding:0 18px;}
.fp-cap{font-size:11px; font-weight:800; letter-spacing:1px; color:var(--text-muted); text-transform:uppercase;}
.fp-body{flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 28px 0; overflow:hidden;}
.fp-art-wrap{width:min(78vw,320px); height:min(78vw,320px); margin: 8px 0 22px; position:relative;}
.fp-art{
  width:100%; height:100%; border-radius:20px; object-fit:cover; box-shadow: var(--shadow-3);
  transition: transform 2.6s ease-in-out;
}
.fp-art.breathe{transform:scale(1.015);}
.fp-meta{width:100%; text-align:center; margin-bottom:14px;}
.fp-title{font-size:21px; font-weight:800; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.fp-artist{font-size:14px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.fp-progress-wrap{width:100%; max-width:420px;}
.fp-progress{
  width:100%; height:5px; border-radius:99px; background:var(--surface-2); position:relative; cursor:pointer;
}
.fp-progress-fill{position:absolute; left:0; top:0; height:100%; border-radius:99px; background:var(--accent); width:0%;}
.fp-progress-handle{position:absolute; top:50%; width:12px;height:12px;border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.4); transform:translate(-50%,-50%); left:0%;}
.fp-times{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); margin-top:6px;}
.fp-controls{display:flex; align-items:center; justify-content:center; gap:22px; margin:20px 0 6px;}
.fp-controls .iconbtn{width:48px;height:48px;font-size:22px;}
.fp-controls .play-main{
  width:70px;height:70px; border-radius:50%; background:var(--accent); color:#fff; font-size:26px;
  box-shadow: 0 10px 30px rgba(var(--accent-rgb),.4);
}
.fp-controls .play-main:active{transform:scale(.94);}
.fp-toggles{display:flex; align-items:center; justify-content:center; gap:30px; margin-bottom:10px;}
.fp-toggles .iconbtn.on{color:var(--accent);}
.fp-row2{display:flex; align-items:center; justify-content:center; gap:36px; margin-bottom:6px;}
.fp-bottom-links{display:flex; justify-content:center; gap:14px; margin-top:auto; padding-top:14px;}
.fp-link-btn{font-size:12px; font-weight:700; color:var(--text-muted); padding:9px 16px; border-radius:999px; background:var(--surface);}

/* Lyrics view */
.lyrics-view{position:fixed; inset:0; z-index:220; display:flex; flex-direction:column; background:var(--bg); transform:translateY(100%); transition:transform var(--dur-slow) var(--ease);}
.lyrics-view.open{transform:translateY(0);}
.lyrics-head{display:flex;align-items:center;justify-content:space-between;padding: calc(var(--safe-t) + 10px) 18px 6px;}
.lyrics-scroll{flex:1; overflow-y:auto; padding:20% 26px 40%; -webkit-overflow-scrolling:touch;}
.lyric-line{
  font-size:19px; font-weight:700; color:var(--text-dim); padding:10px 0; line-height:1.5; transition: color var(--dur) ease, transform var(--dur) ease, opacity var(--dur) ease; cursor:pointer;
}
.lyric-line.active{color:var(--text); font-size:23px; transform: translateX(2px);}
.lyric-line.near{color:var(--text-muted);}
.lyrics-resume{
  position:fixed; bottom:120px; left:50%; transform:translateX(-50%); z-index:230;
  padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:700; display:none;
}
.lyrics-resume.show{display:block;}
.lyrics-empty{padding:60px 20px; text-align:center; color:var(--text-muted);}

/* Sheets */
.sheet-host{position:fixed; inset:0; z-index:300; display:flex; align-items:flex-end; justify-content:center;}
.sheet-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.5); opacity:0; transition:opacity var(--dur);}
.sheet-host.open .sheet-backdrop{opacity:1;}
.sheet{
  position:relative; width:100%; max-width:520px; max-height:82vh; overflow-y:auto;
  border-radius:24px 24px 0 0; padding: 10px 18px calc(var(--safe-b) + 20px);
  transform: translateY(100%); transition: transform var(--dur-slow) var(--ease);
}
.sheet-host.open .sheet{transform:translateY(0);}
@media (min-width:900px){
  .sheet-host{align-items:center;}
  .sheet{border-radius:24px; max-height:74vh;}
}
.sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--border);margin:2px auto 14px;}
.sheet-title{font-size:16px; font-weight:800; margin-bottom:14px;}

/* Audio Lab */
.tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:16px;}
.tab{padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--text-muted); background:var(--surface); flex-shrink:0;}
.tab.active{background:rgba(var(--accent-rgb),.18); color:var(--accent);}
.eq-band{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.eq-band label{width:52px; font-size:11.5px; color:var(--text-muted); flex-shrink:0;}
.eq-band input[type=range]{flex:1;}
.eq-band .val{width:36px;text-align:right;font-size:11px;color:var(--text-dim); flex-shrink:0;}
.preset-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
.preset-btn{padding:7px 13px;border-radius:999px;background:var(--surface);font-size:12px;font-weight:600;}
.preset-btn.active{background:var(--accent); color:#fff;}
.lab-note{font-size:11.5px; color:var(--text-dim); margin:4px 0 16px; line-height:1.5;}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border-soft);}
.toggle-row .lbl{font-size:14px; font-weight:700;}
.toggle-row .sub{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
.switch{width:44px;height:26px;border-radius:99px;background:var(--surface-2); position:relative; flex-shrink:0; transition:background var(--dur-fast);}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform var(--dur-fast) var(--ease); box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch.on{background:var(--accent);}
.switch.on::after{transform:translateX(18px);}
input[type=range]{-webkit-appearance:none; height:4px; border-radius:99px; background:var(--surface-2); outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px;height:16px;border-radius:50%;background:var(--accent); cursor:pointer;}
select.bselect{background:var(--surface); color:var(--text); border:1px solid var(--border-soft); padding:8px 10px; border-radius:var(--radius-s); font-size:13px;}

/* Settings */
.settings-group{margin-bottom:22px;}
.settings-group h3{font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim); margin:0 0 8px;}
.settings-card{background:var(--surface); border-radius:var(--radius); padding:4px 14px;}
.crossfade-presets{display:flex; gap:8px; margin:10px 0; flex-wrap:wrap;}

/* Context menu */
.ctx-menu-item{display:flex; align-items:center; gap:12px; padding:13px 6px; font-size:14.5px; font-weight:600; border-bottom:1px solid var(--border-soft);}
.ctx-menu-item:last-child{border-bottom:none;}

/* Toasts */
.toast-host{position:fixed; left:0; right:0; bottom: calc(90px + var(--safe-b)); z-index:500; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
@media (min-width:900px){.toast-host{bottom:100px;}}
.toast{
  padding:11px 18px; border-radius:999px; font-size:13px; font-weight:700; max-width:86vw;
  animation: toastin .25s var(--ease);
}
@keyframes toastin{from{opacity:0; transform:translateY(10px);} to{opacity:1;transform:translateY(0);}}

/* Buttons generic */
.btn{padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:700; background:var(--accent); color:#fff;}
.btn.ghost{background:var(--surface); color:var(--text);}
.heart-pop{animation: pop .35s var(--ease);}
@keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.35);}100%{transform:scale(1);}}

/* Visualizer */
.visualizer-canvas{width:100%; height:60px; display:block;}

/* Landscape player */
@media (orientation:landscape) and (max-height:520px){
  .fp-body{flex-direction:row; align-items:center; gap:26px; overflow:visible;}
  .fp-art-wrap{width:180px;height:180px; margin:0;}
  .fp-meta-controls{flex:1;}
}

/* Focus visibility */
button:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* Large text / high contrast (accessibility) */
[data-largetext="1"]{font-size:1.12em;}
[data-contrast="1"]{--text-muted: rgba(242,242,245,.78); --border: rgba(255,255,255,.22);}

(function(){
"use strict";
/* =========================================================
   0. CONFIG
========================================================= */
const BOOSTER_CONFIG = {
  MUSIC_API_BASE: "https://jiosaavn-api.raj-pawar091206.workers.dev",
  LYRICS_API_BASE: "https://lrclib.net/api",

const APP_VERSION = "2.0.0";
const DEBUG = false;
const log = (...a)=>{ if(DEBUG) console.log("[BOOSTER]",...a); };

/* =========================================================
   1. UTILITIES
========================================================= */
function decodeEntities(str){
  if(!str) return "";
  const map = {"&amp;":"&","&quot;":"\"","&#039;":"'","&#39;":"'","&lt;":"<","&gt;":">","&apos;":"'","&nbsp;":" "};
  return String(str).replace(/&amp;|&quot;|&#039;|&#39;|&lt;|&gt;|&apos;|&nbsp;/g, m=>map[m])
    .replace(/&#(\d+);/g, (_,n)=>String.fromCharCode(n))
    .replace(/&#x([0-9a-f]+);/gi, (_,n)=>String.fromCharCode(parseInt(n,16)));
}
function fmtTime(s){
  if(!isFinite(s) || s<0) s=0;
  s=Math.floor(s);
  const m=Math.floor(s/60), sec=s%60;
  return m+":"+String(sec).padStart(2,"0");
}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function debounce(fn,ms){let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);};}
function el(tag, cls, attrs){
  const e=document.createElement(tag);
  if(cls) e.className=cls;
  if(attrs) for(const k in attrs){ if(k==="text") e.textContent=attrs[k]; else e.setAttribute(k, attrs[k]); }
  return e;
}
async function fetchJSON(url, {timeout=10000, signal}={}){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), timeout);
  const combinedSignal = signal || ctrl.signal;
  try{
    const res = await fetch(url, {signal: combinedSignal});
    clearTimeout(t);
    if(!res.ok) throw new Error("HTTP "+res.status);
    const json = await res.json();
    return json;
  }catch(e){
    clearTimeout(t);
    throw e;
  }
}
function normalizeKey(s){
  return (s||"").toLowerCase()
    .replace(/\(feat[^)]*\)|\(ft[^)]*\)|\(official[^)]*\)|\(remix[^)]*\)|\(remastered[^)]*\)|\(live[^)]*\)|\(radio edit[^)]*\)/g,"")
    .replace(/feat\.?.*$|ft\.?.*$/g,"")
    .replace(/[^\p{L}\p{N}]+/gu," ")
    .trim().replace(/\s+/g," ");
}

/* =========================================================
   2. STORAGE (IndexedDB + localStorage)
========================================================= */
class Storage{
  constructor(){ this.dbPromise = this._open(); }
  _open(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open("boosterOS_v2", 1);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains("favorites")) db.createObjectStore("favorites",{keyPath:"id"});
        if(!db.objectStoreNames.contains("playlists")) db.createObjectStore("playlists",{keyPath:"id"});
        if(!db.objectStoreNames.contains("history")) db.createObjectStore("history",{keyPath:"key"});
        if(!db.objectStoreNames.contains("lyricsCache")) db.createObjectStore("lyricsCache",{keyPath:"key"});
        if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv",{keyPath:"key"});
      };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }
  async _store(name, mode="readonly"){
    const db = await this.dbPromise;
    return db.transaction(name, mode).objectStore(name);
  }
  async put(storeName, value){
    const db = await this.dbPromise;
    return new Promise((res,rej)=>{
      const tx = db.transaction(storeName,"readwrite");
      tx.objectStore(storeName).put(value);
      tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
    });
  }
  async delete(storeName, key){
    const db = await this.dbPromise;
    return new Promise((res,rej)=>{
      const tx = db.transaction(storeName,"readwrite");
      tx.objectStore(storeName).delete(key);
      tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
    });
  }
  async get(storeName, key){
    const db = await this.dbPromise;
    return new Promise((res,rej)=>{
      const tx = db.transaction(storeName,"readonly");
      const req = tx.objectStore(storeName).get(key);
      req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
    });
  }
  async getAll(storeName){
    const db = await this.dbPromise;
    return new Promise((res,rej)=>{
      const tx = db.transaction(storeName,"readonly");
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess=()=>res(req.result||[]); req.onerror=()=>rej(req.error);
    });
  }
  async clear(storeName){
    const db = await this.dbPromise;
    return new Promise((res,rej)=>{
      const tx = db.transaction(storeName,"readwrite");
      tx.objectStore(storeName).clear();
      tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
    });
  }
  getPref(key, fallback){
    try{ const v = localStorage.getItem("booster:pref:"+key); return v===null? fallback : JSON.parse(v); }
    catch(e){ return fallback; }
  }
  setPref(key, val){
    try{ localStorage.setItem("booster:pref:"+key, JSON.stringify(val)); }catch(e){}
  }
}
const storage = new Storage();

/* =========================================================
   3. MUSIC API ADAPTER
========================================================= */
function bestImage(imgArr){
  if(!imgArr || !imgArr.length) return "";
  return (imgArr.find(i=>i.quality==="500x500")||imgArr[imgArr.length-1]).url;
}
function pickAudioUrl(downloadArr, pref){
  if(!downloadArr || !downloadArr.length) return "";
  const order = pref==="datasaver" ? ["96kbps","160kbps","48kbps","320kbps","12kbps"]
              : pref==="medium" ? ["160kbps","320kbps","96kbps","48kbps","12kbps"]
              : ["320kbps","160kbps","96kbps","48kbps","12kbps"];
  for(const q of order){ const found = downloadArr.find(d=>d.quality===q); if(found) return found.url; }
  return downloadArr[downloadArr.length-1].url;
}
function normalizeSong(raw){
  if(!raw) return null;
  const primary = (raw.artists && raw.artists.primary) || [];
  return {
    id: raw.id,
    type: "song",
    title: decodeEntities(raw.name || raw.title || "Unknown"),
    artist: decodeEntities(primary.map(a=>a.name).join(", ") || raw.primaryArtists || raw.singers || "Unknown Artist"),
    artistId: primary[0] ? primary[0].id : null,
    album: decodeEntities((raw.album && raw.album.name) || raw.album || ""),
    albumId: raw.album ? raw.album.id : null,
    duration: raw.duration ? Number(raw.duration) : 0,
    year: raw.year || null,
    language: raw.language || "",
    image: bestImage(raw.image),
    downloadUrl: raw.downloadUrl || null,
    url: raw.url || "",
    explicit: !!raw.explicitContent
  };
}
function normalizeAlbum(raw){
  if(!raw) return null;
  const primary = (raw.artists && raw.artists.primary) || [];
  return {
    id: raw.id, type:"album",
    title: decodeEntities(raw.name || raw.title || "Unknown Album"),
    artist: decodeEntities(primary.map(a=>a.name).join(", ") || raw.artist || ""),
    image: bestImage(raw.image),
    year: raw.year || null,
    songCount: raw.songCount || (raw.songs?raw.songs.length:0),
    songs: (raw.songs||[]).map(normalizeSong)
  };
}
function normalizeArtist(raw){
  if(!raw) return null;
  return {
    id: raw.id, type:"artist",
    name: decodeEntities(raw.name || "Unknown Artist"),
    image: bestImage(raw.image),
    followerCount: raw.followerCount || 0,
    bio: (raw.bio||[]).map(b=>({title:decodeEntities(b.title||""), text: decodeEntities(b.text||"")})),
    topSongs: (raw.topSongs||[]).map(normalizeSong),
    topAlbums: (raw.topAlbums||[]).map(normalizeAlbum),
    similarArtists: (raw.similarArtists||[]).map(a=>({id:a.id,name:decodeEntities(a.name||""),image:bestImage(a.image)}))
  };
}
function normalizePlaylist(raw){
  if(!raw) return null;
  return {
    id: raw.id, type:"playlist",
    title: decodeEntities(raw.name || raw.title || "Playlist"),
    image: bestImage(raw.image),
    songCount: raw.songCount || (raw.songs?raw.songs.length:0),
    songs: (raw.songs||[]).map(normalizeSong)
  };
}
class MusicAPI{
  constructor(base){ this.base = base; }
  async _get(path){
    try{
      const json = await fetchJSON(this.base+path, {timeout:10000});
      if(!json || json.success===false) throw new Error(json&&json.message || "API error");
      return json.data;
    }catch(e){
      log("MusicAPI error", path, e.message);
      throw e;
    }
  }
  async search(query){
    const data = await this._get("/api/search?query="+encodeURIComponent(query));
    return {
      topQuery: (data.topQuery?.results||[]),
      songs: (data.songs?.results||[]).map(normalizeSong),
      albums: (data.albums?.results||[]).map(r=>normalizeAlbum({...r,name:r.title})),
      artists: (data.artists?.results||[]).map(r=>({id:r.id,name:decodeEntities(r.title||""),image:bestImage(r.image)})),
      playlists: (data.playlists?.results||[]).map(r=>normalizePlaylist({...r,name:r.title}))
    };
  }
  async searchSongs(query,page=0,limit=20){
    const data = await this._get(`/api/search/songs?query=${encodeURIComponent(query)}&page=${page}&limit=${limit}`);
    return (data.results||[]).map(normalizeSong);
  }
  async getSong(id){
    const data = await this._get("/api/songs/"+encodeURIComponent(id));
    return normalizeSong(Array.isArray(data)?data[0]:data);
  }
  async getSongsByIds(ids){
    const data = await this._get("/api/songs?ids="+encodeURIComponent(ids.join(",")));
    return (data||[]).map(normalizeSong);
  }
  async getAlbum(id){
    const data = await this._get("/api/albums?id="+encodeURIComponent(id));
    return normalizeAlbum(data);
  }
  async getArtist(id, {songCount=15, albumCount=10}={}){
    const data = await this._get(`/api/artists/${encodeURIComponent(id)}?songCount=${songCount}&albumCount=${albumCount}`);
    return normalizeArtist(data);
  }
  async getArtistSongs(id, page=0){
    const data = await this._get(`/api/artists/${encodeURIComponent(id)}/songs?page=${page}`);
    return (data.songs||[]).map(normalizeSong);
  }
  async getPlaylist(id){
    const data = await this._get("/api/playlists?id="+encodeURIComponent(id));
    return normalizePlaylist(data);
  }
  async getSuggestions(id, limit=15){
    try{
      const data = await this._get(`/api/songs/${encodeURIComponent(id)}/suggestions?limit=${limit}`);
      return (data||[]).map(normalizeSong);
    }catch(e){
      return []; // graceful fallback - suggestions endpoint may be unstable
    }
  }
  async getRelated(track){
    if(!track) return [];
    let list = await this.getSuggestions(track.id, 15);
    if(list.length===0 && track.artistId){
      try{ list = await this.getArtistSongs(track.artistId); }catch(e){ list=[]; }
    }
    return list;
  }
}
const musicAPI = new MusicAPI(BOOSTER_CONFIG.MUSIC_API_BASE);

/* =========================================================
   4. LYRICS API ADAPTER
========================================================= */
function parseLRC(lrc){
  if(!lrc) return [];
  const lines = lrc.split("\n");
  const out = [];
  const re = /\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\]/g;
  for(const line of lines){
    const matches = [...line.matchAll(re)];
    if(!matches.length) continue;
    const text = line.replace(re,"").trim();
    for(const m of matches){
      const min=parseInt(m[1],10), sec=parseInt(m[2],10), ms=m[3]?parseInt(m[3].padEnd(3,"0"),10):0;
      out.push({time: min*60+sec+ms/1000, text});
    }
  }
  out.sort((a,b)=>a.time-b.time);
  return out;
}
class LyricsAPI{
  constructor(base){ this.base = base; }
  async _get(path, signal){
    const res = await fetch(this.base+path, {signal, headers:{"X-User-Agent":"BoosterOS/2.0 (https://booster.os)"}});
    if(res.status===404) return null;
    if(!res.ok) throw new Error("HTTP "+res.status);
    return res.json();
  }
  async getLyrics(track, signal){
    const params = new URLSearchParams({track_name: track.title, artist_name: track.artist});
    if(track.album) params.set("album_name", track.album);
    if(track.duration) params.set("duration", Math.round(track.duration));
    try{
      const data = await this._get("/get?"+params.toString(), signal);
      if(data) return this._normalize(data);
    }catch(e){ if(e.name==="AbortError") throw e; }
    return this.searchLyrics(track, signal);
  }
  async searchLyrics(track, signal){
    try{
      const params = new URLSearchParams({track_name: track.title, artist_name: track.artist});
      const data = await this._get("/search?"+params.toString(), signal);
      if(!data || !data.length) return null;
      const key = normalizeKey(track.title);
      let best = data.find(d=>normalizeKey(d.trackName)===key) || data[0];
      return this._normalize(best);
    }catch(e){ if(e.name==="AbortError") throw e; return null; }
  }
  _normalize(data){
    if(!data) return null;
    return {
      instrumental: !!data.instrumental,
      plain: data.plainLyrics || "",
      synced: data.syncedLyrics ? parseLRC(data.syncedLyrics) : [],
      source: "lrclib"
    };
  }
}
const lyricsAPI = new LyricsAPI(BOOSTER_CONFIG.LYRICS_API_BASE);

/* =========================================================
   7. PLAYBACK CONTROLLER (single authoritative engine)
========================================================= */
class PlaybackController extends EventTarget{
  constructor(){
    super();
    this.audioA = new Audio(); this.audioA.preload="auto"; this.audioA.crossOrigin="anonymous";
    this.audioB = new Audio(); this.audioB.preload="auto"; this.audioB.crossOrigin="anonymous";
    this.active = this.audioA; this.standby = this.audioB;
    this.loadToken = 0;
    this.crossfading = false;
    this.crossfadeAnimHandle = null;
    this.preparedNextTrack = null;
    this.lyricsRequestId = 0;
    this.artworkCache = new Map();
    this._bind(this.audioA);
    this._bind(this.audioB);
    this.wakeLock = null;
    this.audioCtx = null;
    this.effectChains = new Map(); // audioEl -> chain object
  }
  _bind(audioEl){
    audioEl.addEventListener("timeupdate", ()=>{ if(audioEl===this.active) this._onTimeUpdate(); });
    audioEl.addEventListener("ended", ()=>{ if(audioEl===this.active && !this.crossfading) this._onEnded(); });
    audioEl.addEventListener("error", ()=>{ if(audioEl===this.active) this._onError(); });
    audioEl.addEventListener("waiting", ()=>{ if(audioEl===this.active){ AppState.playerState="buffering"; Renderer.updatePlayIcon(); } });
    audioEl.addEventListener("playing", ()=>{ if(audioEl===this.active){ AppState.playerState="playing"; Renderer.updatePlayIcon(); } });
  }
  get currentTime(){ return this.active.currentTime||0; }
  get duration(){ return this.active.duration||AppState.currentTrack?.duration||0; }

  async _ensureAudioContext(){
    if(this.audioCtx) return this.audioCtx;
    try{
      this.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    }catch(e){ this.audioCtx=null; }
    return this.audioCtx;
  }
  async _getChain(audioEl){
    if(this.effectChains.has(audioEl)) return this.effectChains.get(audioEl);
    const ctx = await this._ensureAudioContext();
    if(!ctx) return null;
    try{
      const source = ctx.createMediaElementSource(audioEl);
      const chain = AudioEffectsEngine.build(ctx, source);
      this.effectChains.set(audioEl, chain);
      return chain;
    }catch(e){ log("effect chain failed", e); return null; }
  }
  async applyEffectsIfEnabled(){
    if(!AppState.audioSettings.labEnabled) return;
    const chain = await this._getChain(this.active);
    if(chain) AudioEffectsEngine.applySettings(chain, AppState.audioSettings);
  }

  async playTrack(track, {resumeTime=0, pushHistory=true, fromAutoplay=false}={}){
    if(!track || !track.id) return;
    const token = ++this.loadToken;
    this.crossfading = false;
    if(this.crossfadeAnimHandle) cancelAnimationFrame(this.crossfadeAnimHandle);
    this.standby.pause();
    AppState.currentTrack = track;
    AppState.playerState = "loading";
    this._registerRecent(track);
    if(pushHistory) AppState.playHistoryStack.push(track);
    LyricsEngine.reset();
    Renderer.updateFullPlayer(true);
    Renderer.updateMiniPlayer();
    ArtworkEngine.processTrack(track);

    const audioUrl = pickAudioUrl(track.downloadUrl, AppState.audioQuality);
    this.active.pause();
    this.active.src = audioUrl;
    this.active.currentTime = resumeTime || 0;
    this.active.volume = 1;
    try{
      await this.active.play();
    }catch(e){
      log("play() failed", e.message);
      if(token!==this.loadToken) return;
      AppState.playerState="error";
      ToastManager.show("Couldn't load this song.");
      this._safeAdvanceAfterError();
      return;
    }
    if(token!==this.loadToken) return;
    AppState.isPlaying = true;
    AppState.playerState = "playing";
    this.preparedNextTrack = null;
    Renderer.updatePlayIcon();
    MediaSessionManager.update(track);
    HistoryStore.record(track);
    this.applyEffectsIfEnabled();
    LyricsEngine.fetchFor(track);
    WakeLockManager.acquire();
    if(fromAutoplay) ToastManager.show("Autoplay: "+track.title);
  }
  play(){
    if(!AppState.currentTrack) return;
    this.active.play().catch(()=>{});
    AppState.isPlaying=true; AppState.playerState="playing";
    Renderer.updatePlayIcon();
    WakeLockManager.acquire();
    if(navigator.mediaSession) navigator.mediaSession.playbackState="playing";
  }
  pause(){
    this.active.pause(); this.standby.pause();
    AppState.isPlaying=false; AppState.playerState="paused";
    Renderer.updatePlayIcon();
    WakeLockManager.release();
    if(navigator.mediaSession) navigator.mediaSession.playbackState="paused";
  }
  toggle(){ AppState.isPlaying ? this.pause() : this.play(); }
  seek(t){
    t = clamp(t,0,this.duration||0);
    this.active.currentTime = t;
    this._onTimeUpdate(true);
  }
  seekBy(delta){ this.seek(this.currentTime+delta); }

  async next(userInitiated=true){
    if(this.crossfading){ this._forceFinishCrossfade(); }
    const nt = await QueueEngine.determineNext(userInitiated);
    if(!nt){ ToastManager.show("Autoplay couldn't find another track."); this.pause(); return; }
    this.playTrack(nt.track, {fromAutoplay: nt.source==="autoplay"});
  }
  previous(){
    if(this.currentTime > 4){ this.seek(0); return; }
    AppState.playHistoryStack.pop(); // remove current
    const prev = AppState.playHistoryStack.pop();
    if(prev){ this.playTrack(prev, {pushHistory:true}); }
    else { this.seek(0); }
  }
  _registerRecent(track){
    AppState.recentTrackIds.unshift(track.id);
    AppState.recentTrackIds = AppState.recentTrackIds.slice(0,25);
    if(track.artistId){
      AppState.recentArtistIds.unshift(track.artistId);
      AppState.recentArtistIds = AppState.recentArtistIds.slice(0,12);
    }
  }
  _onTimeUpdate(force){
    AppState.currentTime = this.currentTime;
    AppState.duration = this.duration;
    Renderer.updateProgress();
    LyricsEngine.onTimeUpdate(this.currentTime);
    if(!force) this._maybeStartCrossfade();
    MediaSessionManager.updatePosition();
  }
  _onError(){
    ToastManager.show("Couldn't load this song.");
    this._safeAdvanceAfterError();
  }
  async _safeAdvanceAfterError(){
    setTimeout(()=>{ this.next(true); }, 400);
  }
  async _onEnded(){
    if(AppState.repeat==="one"){ this.playTrack(AppState.currentTrack, {pushHistory:false}); return; }
    this.next(false);
  }
  async _maybeStartCrossfade(){
    if(this.crossfading) return;
    if(!AppState.crossfadeEnabled || AppState.crossfadeDuration<=0) return;
    if(AppState.repeat==="one") return;
    const dur = this.duration; const remaining = dur - this.currentTime;
    if(!dur || remaining> AppState.crossfadeDuration || remaining < 0.3) return;
    const peek = await QueueEngine.peekNext();
    if(!peek) return;
    this._startCrossfade(peek);
  }
  async _startCrossfade(nextInfo){
    if(this.crossfading) return;
    this.crossfading = true;
    AppState.playerState="crossfading";
    const nextTrack = nextInfo.track;
    const audioUrl = pickAudioUrl(nextTrack.downloadUrl, AppState.audioQuality);
    this.standby.src = audioUrl;
    this.standby.currentTime = 0;
    this.standby.volume = 0;
    try{ await this.standby.play(); }
    catch(e){ this.crossfading=false; return; }
    const dur = AppState.crossfadeDuration*1000;
    const start = performance.now();
    const activeStartVol = this.active.volume;
    const step = ()=>{
      if(!this.crossfading) return;
      const t = clamp((performance.now()-start)/dur, 0, 1);
      this.active.volume = clamp(activeStartVol*(1-t),0,1);
      this.standby.volume = clamp(t,0,1);
      if(t<1){ this.crossfadeAnimHandle = requestAnimationFrame(step); }
      else { this._finishCrossfade(nextTrack, nextInfo.source); }
    };
    this.crossfadeAnimHandle = requestAnimationFrame(step);
  }
  _forceFinishCrossfade(){
    if(!this.crossfading) return;
    if(this.crossfadeAnimHandle) cancelAnimationFrame(this.crossfadeAnimHandle);
    this.active.pause();
    this.crossfading=false;
  }
  _finishCrossfade(nextTrack, source){
    this.crossfading = false;
    const finishedActive = this.active;
    finishedActive.pause();
    finishedActive.removeAttribute("src"); finishedActive.load();
    // swap
    const tmp = this.active; this.active = this.standby; this.standby = tmp;
    this.active.volume = 1;
    AppState.currentTrack = nextTrack;
    AppState.playerState="playing";
    QueueEngine.consumeNext(source);
    this._registerRecent(nextTrack);
    AppState.playHistoryStack.push(nextTrack);
    LyricsEngine.reset();
    ArtworkEngine.processTrack(nextTrack);
    Renderer.updateFullPlayer(true);
    Renderer.updateMiniPlayer();
    Renderer.updatePlayIcon();
    MediaSessionManager.update(nextTrack);
    HistoryStore.record(nextTrack);
    LyricsEngine.fetchFor(nextTrack);
    this.applyEffectsIfEnabled();
    if(source==="autoplay") ToastManager.show("Autoplay: "+nextTrack.title);
  }
}
const Player = new PlaybackController();

/* =========================================================
   8. QUEUE + AUTOPLAY / RECOMMENDATION ENGINE
========================================================= */
const QueueEngine = {
  add(track){ AppState.queue.push({track, source:"user"}); ToastManager.show("Added to Queue"); Renderer.renderQueueIfOpen(); },
  playNext(track){ AppState.queue.unshift({track, source:"user"}); ToastManager.show("Playing next"); Renderer.renderQueueIfOpen(); },
  remove(index){ AppState.queue.splice(index,1); Renderer.renderQueueIfOpen(); },
  clear(){ AppState.queue = []; Renderer.renderQueueIfOpen(); },
  reorder(from,to){ const [item] = AppState.queue.splice(from,1); AppState.queue.splice(to,0,item); Renderer.renderQueueIfOpen(); },
  shuffle(){
    const arr = AppState.queue;
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    Renderer.renderQueueIfOpen();
    ToastManager.show("Queue shuffled");
  },
  setContext(tracks, kind, refId){
    let order = tracks.map((_,i)=>i);
    if(AppState.shuffle){
      for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
    }
    AppState.playbackContext = {tracks, order, pointer:0, kind, refId};
  },
  async peekNext(){
    if(AppState.queue.length>0) return {track:AppState.queue[0].track, source:"user"};
    const ctx = AppState.playbackContext;
    if(ctx){
      if(ctx.pointer+1 < ctx.order.length){
        return {track: ctx.tracks[ctx.order[ctx.pointer+1]], source:"context"};
      }
      if(AppState.repeat==="all" && ctx.order.length>0){
        return {track: ctx.tracks[ctx.order[0]], source:"context-restart"};
      }
    }
    if(AppState.autoplay){
      return RecommendationEngine.getNext();
    }
    return null;
  },
  consumeNext(source){
    if(source==="user"){ AppState.queue.shift(); return; }
    if(source==="context"){ AppState.playbackContext.pointer++; return; }
    if(source==="context-restart"){ AppState.playbackContext.pointer=0; return; }
    // autoplay: nothing persistent to consume, RecommendationEngine tracks its own state via recent lists
  },
  async determineNext(userInitiated){
    const peek = await this.peekNext();
    if(!peek) return null;
    this.consumeNext(peek.source);
    return peek;
  }
};

const RecommendationEngine = {
  cache: new Map(),
  async getNext(){
    const current = AppState.currentTrack;
    if(!current) return null;
    let pool = [];
    try{
      pool = await musicAPI.getRelated(current);
    }catch(e){ pool = []; }
    if(!pool.length && AppState.history.length){
      // fallback: try a favorite artist's songs
      const favArtistId = [...AppState.favorites].length ? null : null;
    }
    const candidates = this._filterAndScore(pool);
    if(!candidates.length) return null;
    const top = candidates.slice(0, Math.min(5, candidates.length));
    const pick = top[Math.floor(Math.random()*top.length)];
    AppState.autoplayQueue = candidates.slice(0,8).map(c=>c.track);
    return {track: pick.track, source:"autoplay"};
  },
  _filterAndScore(pool){
    const recentIds = new Set(AppState.recentTrackIds);
    const recentArtists = AppState.recentArtistIds;
    const favIds = AppState.favorites;
    const currentKey = normalizeKey(AppState.currentTrack.title+"|"+AppState.currentTrack.artist);
    const seen = new Set();
    const out = [];
    for(const track of pool){
      if(!track || !track.id) continue;
      if(recentIds.has(track.id)) continue;
      const key = normalizeKey(track.title+"|"+track.artist);
      if(key===currentKey) continue;
      if(seen.has(key)) continue;
      seen.add(key);
      let score = 0;
      if(favIds.has(track.id)) score += 6;
      const artistRecentIdx = recentArtists.indexOf(track.artistId);
      if(artistRecentIdx>=0) score -= (8 - artistRecentIdx); // penalize recent artist repetition
      if(AppState.skippedIds.has(track.id)) score -= 10;
      score += Math.random()*3; // small variety jitter
      out.push({track, score});
    }
    out.sort((a,b)=>b.score-a.score);
    return out;
  }
};

/* =========================================================
   9. LYRICS ENGINE
========================================================= */
const LyricsEngine = {
  activeIndex:-1,
  lines: [],
  manualMode:false,
  autoScrollFlag:false,
  reset(){
    this.lines = []; this.activeIndex=-1; AppState.lyrics=null; this.manualMode=false;
    const scroll = document.getElementById("lyricsScroll");
    scroll.innerHTML = "";
    const empty = el("div","lyrics-empty",{text:"Loading lyrics…"});
    scroll.appendChild(empty);
    document.getElementById("lyricsResume").classList.remove("show");
  },
  async fetchFor(track){
    const id = ++Player.lyricsRequestId;
    const cacheKey = "lrc:"+normalizeKey(track.title)+"|"+normalizeKey(track.artist);
    try{
      const cached = await storage.get("lyricsCache", cacheKey);
      if(cached && id===Player.lyricsRequestId){
        this._apply(cached.data, id);
        return;
      }
    }catch(e){}
    try{
      const data = await lyricsAPI.getLyrics(track);
      if(id!==Player.lyricsRequestId) return; // stale
      if(data){
        storage.put("lyricsCache", {key:cacheKey, data, timestamp:Date.now()}).catch(()=>{});
      }
      this._apply(data, id);
    }catch(e){
      if(id===Player.lyricsRequestId) this._apply(null, id);
    }
  },
  _apply(data, id){
    if(id!==Player.lyricsRequestId) return;
    AppState.lyrics = data;
    this.lines = (data && data.synced && data.synced.length) ? data.synced : [];
    this._renderStatic();
  },
  _renderStatic(){
    const scroll = document.getElementById("lyricsScroll");
    scroll.innerHTML = "";
    if(!AppState.lyrics){
      scroll.appendChild(el("div","lyrics-empty",{text:"Lyrics aren't available for this track yet."}));
      return;
    }
    if(AppState.lyrics.instrumental){
      scroll.appendChild(el("div","lyrics-empty",{text:"🎵 Instrumental track"}));
      return;
    }
    if(!this.lines.length){
      if(AppState.lyrics.plain){
        const p = el("div","lyric-line active",{});
        p.style.whiteSpace="pre-line";
        p.textContent = AppState.lyrics.plain;
        p.style.cursor="default";
        scroll.appendChild(p);
      } else {
        scroll.appendChild(el("div","lyrics-empty",{text:"Lyrics aren't available for this track yet."}));
      }
      return;
    }
    this.lines.forEach((line,i)=>{
      const d = el("div","lyric-line", {text: line.text||"…"});
      d.dataset.idx = i;
      d.addEventListener("click", ()=>{
        Player.seek(line.time);
        this._haptic();
      });
      scroll.appendChild(d);
    });
    scroll.addEventListener("scroll", ()=>{
      if(this.autoScrollFlag){ this.autoScrollFlag=false; return; }
      this.manualMode = true;
      document.getElementById("lyricsResume").classList.add("show");
    }, {passive:true});
  },
  onTimeUpdate(t){
    if(!this.lines.length) return;
    const idx = this._binarySearch(t + (AppState.lyricsSettings.syncOffset||0));
    if(idx===this.activeIndex) return;
    const prevIdx = this.activeIndex;
    this.activeIndex = idx;
    const scroll = document.getElementById("lyricsScroll");
    if(!scroll) return;
    if(prevIdx>=0){ const p=scroll.querySelector(`[data-idx="${prevIdx}"]`); if(p) p.classList.remove("active"); }
    if(idx>=0){
      const cur = scroll.querySelector(`[data-idx="${idx}"]`);
      if(cur){
        cur.classList.add("active");
        if(AppState.lyricsSettings.autoFollow && !this.manualMode && scroll.closest(".lyrics-view").classList.contains("open")){
          this.autoScrollFlag = true;
          const target = cur.offsetTop - scroll.clientHeight*0.4;
          scroll.scrollTo({top: Math.max(0,target), behavior:"smooth"});
        }
      }
    }
  },
  _binarySearch(t){
    let lo=0, hi=this.lines.length-1, ans=-1;
    while(lo<=hi){
      const mid=(lo+hi)>>1;
      if(this.lines[mid].time<=t){ ans=mid; lo=mid+1; } else { hi=mid-1; }
    }
    return ans;
  },
  resume(){
    this.manualMode=false;
    document.getElementById("lyricsResume").classList.remove("show");
    if(this.activeIndex>=0){
      const scroll = document.getElementById("lyricsScroll");
      const cur = scroll.querySelector(`[data-idx="${this.activeIndex}"]`);
      if(cur){ this.autoScrollFlag=true; scroll.scrollTo({top: Math.max(0, cur.offsetTop - scroll.clientHeight*0.4), behavior:"smooth"}); }
    }
  },
  _haptic(){ if(navigator.vibrate) try{navigator.vibrate(8);}catch(e){} }
};

/* =========================================================
   10. ARTWORK ENGINE
========================================================= */
const ArtworkEngine = {
  cache: new Map(),
  lastId:null,
  processTrack(track){
    if(!track || track.id===this.lastId) return;
    this.lastId = track.id;
    if(!AppState.dynamicBg || AppState.performanceMode==="battery"){ return; }
    if(this.cache.has(track.image)){ this._apply(this.cache.get(track.image)); return; }
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = ()=>{
      try{
        const c = document.createElement("canvas");
        c.width=16; c.height=16;
        const ctx = c.getContext("2d");
        ctx.drawImage(img,0,0,16,16);
        const data = ctx.getImageData(0,0,16,16).data;
        let r=0,g=0,b=0,n=0, vr=0,vg=0,vb=0,maxSat=-1;
        for(let i=0;i<data.length;i+=4){
          const R=data[i],G=data[i+1],B=data[i+2];
          r+=R;g+=G;b+=B;n++;
          const mx=Math.max(R,G,B), mn=Math.min(R,G,B);
          const sat = mx===0?0:(mx-mn)/mx;
          if(sat>maxSat){ maxSat=sat; vr=R; vg=G; vb=B; }
        }
        r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
        const palette = {a:[r,g,b], b:[vr,vg,vb]};
        this.cache.set(track.image, palette);
        if(this.lastId===track.id) this._apply(palette);
      }catch(e){ /* tainted canvas or other failure - keep neutral */ }
    };
    img.onerror = ()=>{};
    img.src = track.image;
  },
  _apply(palette){
    document.documentElement.style.setProperty("--ambient-1", palette.a.join(","));
    document.documentElement.style.setProperty("--ambient-2", palette.b.join(","));
  }
};

/* =========================================================
   11. AUDIO EFFECTS ENGINE (Audio Lab)
========================================================= */
const AudioEffectsEngine = {
  build(ctx, source){
    const eq = EQ_BANDS.map((f,i)=>{
      const filter = ctx.createBiquadFilter();
      filter.type = (i===0)?"lowshelf":(i===EQ_BANDS.length-1)?"highshelf":"peaking";
      filter.frequency.value = f;
      filter.Q.value = 1;
      filter.gain.value = 0;
      return filter;
    });
    const vocalBoost = ctx.createBiquadFilter();
    vocalBoost.type="peaking"; vocalBoost.frequency.value=2500; vocalBoost.Q.value=1; vocalBoost.gain.value=0;
    const vocalCut = ctx.createBiquadFilter();
    vocalCut.type="notch"; vocalCut.frequency.value=1500; vocalCut.Q.value=0.7; vocalCut.gain.value=0;
    const panner = ctx.createStereoPanner();
    const splitter = ctx.createChannelSplitter(2);
    const merger = ctx.createChannelMerger(2);
    const delayL = ctx.createDelay(0.05); delayL.delayTime.value = 0;
    const widthGain = ctx.createGain(); widthGain.gain.value = 1;
    const convolver = ctx.createConvolver();
    convolver.buffer = this._impulse(ctx, 1.4, 2.2);
    const reverbGain = ctx.createGain(); reverbGain.gain.value = 0;
    const dryGain = ctx.createGain(); dryGain.gain.value = 1;
    const delayNode = ctx.createDelay(1.0); delayNode.delayTime.value=0.001;
    const feedback = ctx.createGain(); feedback.gain.value=0;
    const echoWet = ctx.createGain(); echoWet.gain.value=0;
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value=-8; limiter.knee.value=12; limiter.ratio.value=6; limiter.attack.value=0.003; limiter.release.value=0.25;
    const masterGain = ctx.createGain(); masterGain.gain.value = 1;

    // chain: source -> eq[0..6] -> vocalBoost -> vocalCut -> panner -> [split/merge width] -> dry+reverb+echo -> limiter -> master -> destination
    let node = source;
    eq.forEach(f=>{ node.connect(f); node=f; });
    node.connect(vocalBoost); node = vocalBoost;
    node.connect(vocalCut); node = vocalCut;
    node.connect(panner); node = panner;
    // stereo width via split/merge with slight delay + gain on side channel
    panner.connect(splitter);
    splitter.connect(merger,0,0);
    splitter.connect(delayL,1);
    delayL.connect(widthGain);
    widthGain.connect(merger,0,1);
    merger.connect(dryGain);
    merger.connect(convolver);
    convolver.connect(reverbGain);
    merger.connect(delayNode);
    delayNode.connect(feedback);
    feedback.connect(delayNode);
    delayNode.connect(echoWet);
    dryGain.connect(limiter);
    reverbGain.connect(limiter);
    echoWet.connect(limiter);
    limiter.connect(masterGain);
    masterGain.connect(ctx.destination);

    return {ctx, source, eq, vocalBoost, vocalCut, panner, delayL, widthGain, reverbGain, dryGain, delayNode, feedback, echoWet, limiter, masterGain, spatialPhase:0, spatialTimer:null};
  },
  _impulse(ctx, duration, decay){
    const rate = ctx.sampleRate;
    const len = rate*duration;
    const buf = ctx.createBuffer(2, len, rate);
    for(let ch=0; ch<2; ch++){
      const data = buf.getChannelData(ch);
      for(let i=0;i<len;i++){ data[i] = (Math.random()*2-1)*Math.pow(1-i/len, decay); }
    }
    return buf;
  },
  applySettings(chain, s){
    try{
      chain.eq.forEach((f,i)=>{ f.gain.value = clamp((s.eqGains[i]||0)+ (i===0?s.bass:0) + (i===chain.eq.length-1?s.treble:0), -12,12); });
      chain.vocalBoost.gain.value = clamp(s.vocalBoost,0,8);
      chain.vocalCut.gain.value = s.vocalCut ? -14 : 0;
      chain.reverbGain.gain.value = clamp(s.reverb,0,0.35);
      chain.dryGain.gain.value = 1 - clamp(s.reverb,0,0.35)*0.4;
      chain.feedback.gain.value = clamp(s.echo,0,0.4)*0.5;
      chain.echoWet.gain.value = clamp(s.echo,0,0.4);
      chain.delayNode.delayTime.value = 0.22;
      const widthMap = {mono:0, off:1, normal:1, wide:1.6};
      const wv = widthMap[s.stereoWidth] ?? 1;
      chain.widthGain.gain.value = s.stereoWidth==="mono" ? 0 : wv;
      chain.delayL.delayTime.value = s.stereoWidth==="wide" ? 0.012 : 0.004;
      chain.limiter.threshold.value = s.limiter ? -8 : -1;
      if(s.spatial && !chain.spatialTimer){
        chain.spatialTimer = setInterval(()=>{
          chain.spatialPhase += s.spatialSpeed*0.15;
          chain.panner.pan.value = Math.sin(chain.spatialPhase)*clamp(s.spatialDepth,0,1);
        }, 60);
      } else if(!s.spatial && chain.spatialTimer){
        clearInterval(chain.spatialTimer); chain.spatialTimer=null; chain.panner.pan.value=0;
      }
    }catch(e){ log("effect apply failed", e); }
  }
};

/* =========================================================
   12. MEDIA SESSION
========================================================= */
const MediaSessionManager = {
  init(){
    if(!("mediaSession" in navigator)) return;
    const ms = navigator.mediaSession;
    ms.setActionHandler("play", ()=>Player.play());
    ms.setActionHandler("pause", ()=>Player.pause());
    ms.setActionHandler("previoustrack", ()=>Player.previous());
    ms.setActionHandler("nexttrack", ()=>Player.next(true));
    try{ ms.setActionHandler("seekbackward", (d)=>Player.seekBy(-(d.seekOffset||10))); }catch(e){}
    try{ ms.setActionHandler("seekforward", (d)=>Player.seekBy(d.seekOffset||10)); }catch(e){}
    try{ ms.setActionHandler("seekto", (d)=>Player.seek(d.seekTime)); }catch(e){}
  },
  update(track){
    if(!("mediaSession" in navigator)) return;
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title, artist: track.artist, album: track.album||"",
        artwork: [96,128,192,256,384,512].map(s=>({src:track.image, sizes:s+"x"+s, type:"image/jpeg"}))
      });
      navigator.mediaSession.playbackState = "playing";
    }catch(e){}
  },
  updatePosition(){
    if(!("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
    try{
      const dur = Player.duration;
      if(dur>0) navigator.mediaSession.setPositionState({duration:dur, playbackRate:1, position: clamp(Player.currentTime,0,dur)});
    }catch(e){}
  }
};

/* =========================================================
   13. WAKE LOCK
========================================================= */
const WakeLockManager = {
  lock:null,
  async acquire(){
    if(!("wakeLock" in navigator) || this.lock) return;
    try{ this.lock = await navigator.wakeLock.request("screen"); }catch(e){ this.lock=null; }
  },
  release(){ if(this.lock){ try{this.lock.release();}catch(e){} this.lock=null; } }
};

const HistoryStore = {
  async record(track){
    AppState.history.unshift({...track, timestamp:Date.now()});
    AppState.history = AppState.history.slice(0,500);
    try{ await storage.put("history", {key:"h_"+Date.now()+"_"+track.id, track, timestamp:Date.now()}); }catch(e){}
    this._prune();
  },
  async _prune(){
    try{
      const all = await storage.getAll("history");
      if(all.length>500){
        all.sort((a,b)=>a.timestamp-b.timestamp);
        const toRemove = all.slice(0, all.length-500);
        for(const item of toRemove) await storage.delete("history", item.key);
      }
    }catch(e){}
  },
  async loadAll(){
    try{
      const all = await storage.getAll("history");
      all.sort((a,b)=>b.timestamp-a.timestamp);
      AppState.history = all.map(a=>({...a.track, timestamp:a.timestamp}));
    }catch(e){ AppState.history=[]; }
  },
  async clear(){ await storage.clear("history"); AppState.history=[]; }
};
const FavoritesStore = {
  async load(){
    try{
      const all = await storage.getAll("favorites");
      AppState.favorites = new Set(all.map(f=>f.id));
    }catch(e){ AppState.favorites = new Set(); }
  },
  async toggle(track){
    const has = AppState.favorites.has(track.id);
    if(has){ AppState.favorites.delete(track.id); await storage.delete("favorites", track.id); ToastManager.show("Removed from Favorites"); }
    else { AppState.favorites.add(track.id); await storage.put("favorites", {...track, id:track.id, addedAt:Date.now()}); ToastManager.show("Added to Favorites"); }
    Renderer.updateFavoriteButtons();
    return !has;
  },
  async getAllTracks(){
    try{ const all = await storage.getAll("favorites"); all.sort((a,b)=>(b.addedAt||0)-(a.addedAt||0)); return all; }
    catch(e){ return []; }
  }
};
const PlaylistStore = {
  async load(){ try{ AppState.playlists = await storage.getAll("playlists"); }catch(e){ AppState.playlists=[]; } },
  async create(name){
    const pl = {id:uid(), name, songs:[], createdAt:Date.now()};
    AppState.playlists.push(pl);
    await storage.put("playlists", pl);
    ToastManager.show("Playlist Created");
    return pl;
  },
  async rename(id,name){ const pl=AppState.playlists.find(p=>p.id===id); if(!pl)return; pl.name=name; await storage.put("playlists",pl); },
  async remove(id){ AppState.playlists = AppState.playlists.filter(p=>p.id!==id); await storage.delete("playlists", id); },
  async addSong(id, track){
    const pl = AppState.playlists.find(p=>p.id===id); if(!pl) return;
    if(!pl.songs.find(s=>s.id===track.id)){ pl.songs.push(track); await storage.put("playlists", pl); ToastManager.show("Added to "+pl.name); }
  },
  async removeSong(id, trackId){
    const pl = AppState.playlists.find(p=>p.id===id); if(!pl) return;
    pl.songs = pl.songs.filter(s=>s.id!==trackId); await storage.put("playlists", pl);
  }
};

========================================================= */
const ThemeManager = {
  apply(){
    let theme = AppState.theme;
    if(theme==="system"){
      theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light":"dark";
    }
    document.documentElement.setAttribute("data-theme", theme==="light"?"light":"dark");
    document.documentElement.setAttribute("data-largetext", AppState.largeText?"1":"0");
    document.documentElement.setAttribute("data-contrast", AppState.highContrast?"1":"0");
  }
};
const PerformanceManager = {
  frameSamples:[], monitoring:false,
  apply(){
    let mode = AppState.performanceMode;
    if(mode==="auto"){
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const weakCPU = (navigator.hardwareConcurrency||4) <= 2;
      mode = (reduce||weakCPU) ? "battery" : "balanced";
      this._startMonitor();
    } else { this._stopMonitor(); }
    document.documentElement.setAttribute("data-perf", mode);
  },
  _startMonitor(){
    if(this.monitoring) return;
    this.monitoring = true;
    let last = performance.now();
    const loop = (now)=>{
      if(!this.monitoring) return;
      const dt = now-last; last=now;
      this.frameSamples.push(dt);
      if(this.frameSamples.length>90) this.frameSamples.shift();
      if(this.frameSamples.length===90){
        const avg = this.frameSamples.reduce((a,b)=>a+b,0)/90;
        if(avg>28 && document.documentElement.getAttribute("data-perf")!=="battery"){
          document.documentElement.setAttribute("data-perf","battery");
          ToastManager.show("Performance mode adjusted for smoother playback.");
        }
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },
  _stopMonitor(){ this.monitoring=false; this.frameSamples=[]; }
};

/* =========================================================
   17. ROUTER
========================================================= */
const Router = {
  routes:{},
  current:"/",
  register(path, fn){ this.routes[path]=fn; },
  navigate(path, {replace=false}={}){
    if(replace) history.replaceState({path}, "", "#"+path);
    else history.pushState({path}, "", "#"+path);
    this._render(path);
  },
  back(){ history.back(); },
  init(){
    window.addEventListener("popstate", (e)=>{
      const path = (e.state && e.state.path) || this._pathFromHash();
      this._render(path);
    });
    this._render(this._pathFromHash());
  },
  _pathFromHash(){ return location.hash.slice(1) || "/"; },
  _render(path){
    this.current = path;
    document.querySelectorAll(".navitem").forEach(n=>{
      n.classList.toggle("active", n.dataset.route===this._base(path));
    });
    document.getElementById("backBtn").hidden = (path==="/");
    const parts = path.split("/").filter(Boolean);
    let handler = this.routes[path];
    if(!handler && parts.length>=2){ handler = this.routes["/"+parts[0]+"/:id"]; }
    if(handler) handler(parts[1]);
    else this.routes["/"]();
  },
  _base(path){ return "/"+path.split("/").filter(Boolean)[0] || "/"; }
};

const PlaybackActions = {
  playFromList(list, index, kind, refId){
    if(!list || !list.length) return;
    QueueEngine.setContext(list, kind, refId);
    AppState.playbackContext.pointer = AppState.shuffle ? AppState.playbackContext.order.indexOf(index) : index;
    if(AppState.playbackContext.pointer<0) AppState.playbackContext.pointer=0;
    const track = list[index];
    Player.playTrack(track);
    FullPlayerUI.open();
  }
};

          const row = el("div","eq-band");
          row.appendChild(el("label",null,{text:label}));
          const range = el("input"); range.type="range"; range.min=min; range.max=max; range.step=step; range.value=s[key];
          const valSpan = el("span","val",{text:s[key].toFixed(2)});
          range.addEventListener("input", ()=>{ s[key]=Number(range.value); valSpan.textContent=s[key].toFixed(2); SettingsStore.save(); Player.applyEffectsIfEnabled(); });
          row.appendChild(range); row.appendChild(valSpan);
          panels.appendChild(row);
        });
      }
      if(activeTab==="REVERB"){
        panels.appendChild(el("div","lab-note",{text:"Subtle ambience effects. Echo feedback is safely limited to prevent runaway repeats."}));
        [["Reverb","reverb",0,0.35,0.02],["Echo","echo",0,0.4,0.02]].forEach(([label,key,min,max,step])=>{
          const row = el("div","eq-band");
          row.appendChild(el("label",null,{text:label}));
          const range = el("input"); range.type="range"; range.min=min; range.max=max; range.step=step; range.value=s[key];
          const valSpan = el("span","val",{text:Math.round(s[key]*100)+"%"});
          range.addEventListener("input", ()=>{ s[key]=Number(range.value); valSpan.textContent=Math.round(s[key]*100)+"%"; SettingsStore.save(); Player.applyEffectsIfEnabled(); });
          row.appendChild(range); row.appendChild(valSpan);
          panels.appendChild(row);
        });
        panels.appendChild(Renderer._toggleRow("Limiter","Prevents clipping and keeps output safe.", s.limiter, (v)=>{ s.limiter=v; SettingsStore.save(); Player.applyEffectsIfEnabled(); }));
      }
    }
    tabDefs.forEach(t=>{
      const tb = el("button","tab"+(t===activeTab?" active":""),{text:t});
      tb.addEventListener("click", ()=>{ activeTab=t; tabs.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); tb.classList.add("active"); renderPanel(); });
      tabs.appendChild(tb);
    });
    renderPanel();
    SheetManager.open(content);
  }
});

/* =========================================================
   23. SLEEP TIMER
========================================================= */
const SleepTimer = {
  timeoutId:null, endsAt:null, tickInterval:null,
  open(){
    const content = el("div");
    content.appendChild(el("div","sheet-handle"));
    content.appendChild(el("div","sheet-title",{text:"Sleep Timer"}));
    if(AppState.sleepTimer){
      const info = el("div","lab-note",{text:"Timer active. Playback will pause automatically."});
      content.appendChild(info);
      const cancelBtn = el("button","btn ghost",{text:"Cancel Timer"});
      cancelBtn.addEventListener("click",()=>{ this.cancel(); SheetManager.close(); });
      content.appendChild(cancelBtn);
    } else {
      const grid = el("div","preset-grid");
      [5,10,15,30,45,60].forEach(min=>{
        const b = el("button","preset-btn",{text:min+" min"});
        b.addEventListener("click",()=>{ this.start(min*60000); SheetManager.close(); });
        grid.appendChild(b);
      });
      const eos = el("button","preset-btn",{text:"End of Song"});
      eos.addEventListener("click",()=>{ this.startEndOfSong(); SheetManager.close(); });
      grid.appendChild(eos);
      content.appendChild(grid);
    }
    SheetManager.open(content);
  },
  start(ms){
    this.cancel();
    this.endsAt = Date.now()+ms;
    AppState.sleepTimer = {endsAt:this.endsAt, mode:"timed"};
    this.timeoutId = setTimeout(()=>{ Player.pause(); this.cancel(); ToastManager.show("Sleep timer ended. Playback paused."); }, ms);
    ToastManager.show("Sleep timer set");
  },
  startEndOfSong(){
    this.cancel();
    AppState.sleepTimer = {mode:"eos"};
    const handler = ()=>{ Player.pause(); this.cancel(); Player.removeEventListener?.(); };
    this._eosHandler = ()=>{ Player.pause(); this.cancel(); ToastManager.show("Sleep timer ended."); };
    Player.audioA.addEventListener("ended", this._eosOnce = ()=>{ if(AppState.sleepTimer && AppState.sleepTimer.mode==="eos"){ this._eosHandler(); } }, {once:true});
    ToastManager.show("Will stop at end of song");
  },
  cancel(){
    if(this.timeoutId) clearTimeout(this.timeoutId);
    this.timeoutId=null; this.endsAt=null; AppState.sleepTimer=null;
  }
};

/* =========================================================
   24. VISUALIZER (optional, lightweight)
========================================================= */
const Visualizer = {
  mode:"off", canvas:null, ctx:null, analyser:null, raf:null,
  async enable(mode){
    this.mode = mode;
    if(mode==="off"){ this.disable(); return; }
    if(document.hidden || AppState.performanceMode==="battery") return;
    const chain = await Player._getChain(Player.active);
    if(!chain) return;
    if(!this.analyser){
      this.analyser = chain.ctx.createAnalyser();
      this.analyser.fftSize = 128;
      chain.masterGain.connect(this.analyser);
    }
    this._loop();
  },
  disable(){ this.mode="off"; if(this.raf) cancelAnimationFrame(this.raf); this.raf=null; },
  _loop(){
    if(this.mode==="off" || !this.canvas) return;
    const data = new Uint8Array(this.analyser.frequencyBinCount);
    this.analyser.getByteFrequencyData(data);
    const ctx = this.ctx, w=this.canvas.width, h=this.canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "rgba(124,139,255,0.8)";
    if(this.mode==="bars"){
      const bw = w/data.length;
      data.forEach((v,i)=>{ const bh=(v/255)*h; ctx.fillRect(i*bw,h-bh,bw-1,bh); });
    } else if(this.mode==="wave"){
      ctx.beginPath();
      data.forEach((v,i)=>{ const x=i/data.length*w; const y=h-(v/255)*h; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.strokeStyle="rgba(124,139,255,0.9)"; ctx.stroke();
    } else if(this.mode==="circle"){
      const cx=w/2, cy=h/2, r=Math.min(w,h)/4;
      ctx.beginPath();
      data.forEach((v,i)=>{ const ang=(i/data.length)*Math.PI*2; const rad=r+(v/255)*r; const x=cx+Math.cos(ang)*rad; const y=cy+Math.sin(ang)*rad; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.closePath(); ctx.strokeStyle="rgba(201,139,255,0.8)"; ctx.stroke();
    }
    this.raf = requestAnimationFrame(()=>this._loop());
  }
};
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) Visualizer.disable(); });

/* =========================================================
   26. GESTURE MANAGER
========================================================= */
const GestureManager = {
  init(){
    this._bindMiniPlayer();
    this._bindFullPlayerSwipe();
    this._bindProgressSeek();
    this._bindArtworkDoubleTap();
  },
  _bindMiniPlayer(){
    const mp = document.getElementById("miniPlayer");
    let sx=0, sy=0, dragging=false, moved=false;
    mp.addEventListener("click", (e)=>{
      if(e.target.closest("#miniPlay") || e.target.closest("#miniFav")) return;
      if(!moved) FullPlayerUI.open();
    });
    mp.addEventListener("touchstart", (e)=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; dragging=true; moved=false; }, {passive:true});
    mp.addEventListener("touchmove", (e)=>{
      if(!dragging) return;
      const t=e.touches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
      if(Math.abs(dx)>10 || Math.abs(dy)>10) moved=true;
    }, {passive:true});
    mp.addEventListener("touchend", (e)=>{
      if(!dragging) return; dragging=false;
      const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
      if(dy < -40 && Math.abs(dy)>Math.abs(dx)){ FullPlayerUI.open(); }
      else if(dx < -60 && Math.abs(dx)>Math.abs(dy)){ Player.next(true); }
      else if(dx > 60 && Math.abs(dx)>Math.abs(dy)){ Player.previous(); }
    });
  },
  _bindFullPlayerSwipe(){
    const fp = document.getElementById("fullPlayer");
    let sx=0, sy=0, dragging=false;
    fp.addEventListener("touchstart",(e)=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; dragging=true; },{passive:true});
    fp.addEventListener("touchmove",(e)=>{},{passive:true});
    fp.addEventListener("touchend",(e)=>{
      if(!dragging) return; dragging=false;
      const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
      if(dy>70 && Math.abs(dy)>Math.abs(dx)){ FullPlayerUI.close(); }
      else if(dy<-70 && Math.abs(dy)>Math.abs(dx)){ LyricsEngine.reset.bind(LyricsEngine); LyricsViewUI.open(); LyricsEngine._renderStatic(); }
      else if(dx<-70 && Math.abs(dx)>Math.abs(dy)){ Player.next(true); }
      else if(dx>70 && Math.abs(dx)>Math.abs(dy)){ Player.previous(); }
    });
  },
  _bindProgressSeek(){
    const bar = document.getElementById("fpProgress");
    const seekFromEvent = (clientX)=>{
      const rect = bar.getBoundingClientRect();
      const pct = clamp((clientX-rect.left)/rect.width,0,1);
      Player.seek(pct*(Player.duration||0));
    };
    bar.addEventListener("click", (e)=>seekFromEvent(e.clientX));
    let dragging=false;
    bar.addEventListener("touchstart",(e)=>{ dragging=true; seekFromEvent(e.touches[0].clientX); },{passive:true});
    bar.addEventListener("touchmove",(e)=>{ if(dragging) seekFromEvent(e.touches[0].clientX); },{passive:true});
    bar.addEventListener("touchend",()=>{ dragging=false; });
    bar.addEventListener("keydown",(e)=>{
      if(e.key==="ArrowRight") Player.seekBy(5);
      if(e.key==="ArrowLeft") Player.seekBy(-5);
    });
  },
  _bindArtworkDoubleTap(){
    const art = document.getElementById("fpArt");
    let lastTap=0;
    art.addEventListener("click", async ()=>{
      const now=Date.now();
      if(now-lastTap<320){
        if(AppState.currentTrack){
          const nowFav = await FavoritesStore.toggle(AppState.currentTrack);
          art.classList.add("heart-pop"); setTimeout(()=>art.classList.remove("heart-pop"),350);
          if(navigator.vibrate) try{navigator.vibrate(12);}catch(e){}
        }
      }
      lastTap=now;
    });
  }
};

/* =========================================================
   27. KEYBOARD SHORTCUTS
========================================================= */
document.addEventListener("keydown", (e)=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input" || tag==="textarea" || e.target.isContentEditable) return;
  switch(e.key.toLowerCase()){
    case " ": e.preventDefault(); Player.toggle(); break;
    case "arrowleft": Player.seekBy(-10); break;
    case "arrowright": Player.seekBy(10); break;
    case "n": Player.next(true); break;
    case "p": Player.previous(); break;
    case "m": Player.active.muted = !Player.active.muted; break;
    case "l": LyricsViewUI.open(); LyricsEngine._renderStatic(); break;
    case "f": FullPlayerUI.open(); break;
  }
});

/* =========================================================
   28. EVENT BINDINGS (buttons)
========================================================= */
function bindUI(){
  document.getElementById("miniPlay").addEventListener("click",(e)=>{ e.stopPropagation(); Player.toggle(); });
  document.getElementById("miniFav").addEventListener("click", async (e)=>{
    e.stopPropagation();
    if(AppState.currentTrack){ await FavoritesStore.toggle(AppState.currentTrack); e.target.classList.add("heart-pop"); setTimeout(()=>e.target.classList.remove("heart-pop"),350); }
  });
  document.getElementById("fpClose").addEventListener("click", ()=>FullPlayerUI.close());
  document.getElementById("fpPlay").addEventListener("click", ()=>Player.toggle());
  document.getElementById("fpNext").addEventListener("click", ()=>Player.next(true));
  document.getElementById("fpPrev").addEventListener("click", ()=>Player.previous());
  document.getElementById("fpShuffle").addEventListener("click", ()=>{
    AppState.shuffle = !AppState.shuffle; SettingsStore.save(); Renderer.updateShuffleRepeatIcons();
    ToastManager.show(AppState.shuffle?"Shuffle: ON":"Shuffle: OFF");
    if(AppState.playbackContext){
      const cur = AppState.playbackContext.tracks[AppState.playbackContext.order[AppState.playbackContext.pointer]];
      QueueEngine.setContext(AppState.playbackContext.tracks, AppState.playbackContext.kind, AppState.playbackContext.refId);
      const idx = AppState.playbackContext.tracks.indexOf(cur);
      AppState.playbackContext.pointer = AppState.playbackContext.order.indexOf(idx);
    }
  });
  document.getElementById("fpRepeat").addEventListener("click", ()=>{
    AppState.repeat = AppState.repeat==="off" ? "all" : AppState.repeat==="all" ? "one" : "off";
    SettingsStore.save(); Renderer.updateShuffleRepeatIcons();
    ToastManager.show("Repeat: "+AppState.repeat.toUpperCase());
  });
  document.getElementById("fpFav").addEventListener("click", async (e)=>{
    if(AppState.currentTrack){ await FavoritesStore.toggle(AppState.currentTrack); e.target.classList.add("heart-pop"); setTimeout(()=>e.target.classList.remove("heart-pop"),350); }
  });
  document.getElementById("fpQueue").addEventListener("click", ()=>{ FullPlayerUI.close(); Router.navigate("/queue"); });
  document.getElementById("fpMore").addEventListener("click", ()=>{ if(AppState.currentTrack) ContextMenu.open(AppState.currentTrack); });
  document.getElementById("fpLyricsBtn").addEventListener("click", ()=>{ LyricsViewUI.open(); LyricsEngine._renderStatic(); });
  document.getElementById("fpLabBtn").addEventListener("click", ()=>AudioLabUI.open());
  document.getElementById("lyricsClose").addEventListener("click", ()=>LyricsViewUI.close());
  document.getElementById("lyricsResume").addEventListener("click", ()=>LyricsEngine.resume());

  document.querySelectorAll(".navitem[data-route]").forEach(btn=>{
    btn.addEventListener("click", ()=>Router.navigate(btn.dataset.route));
  });
  document.getElementById("backBtn").addEventListener("click", ()=>Router.back());
}

/* =========================================================
   30. OFFLINE / ONLINE
========================================================= */
function bindNetworkStatus(){
  const ind = document.getElementById("offlineIndicator");
  const update = ()=>{ ind.hidden = navigator.onLine; };
  window.addEventListener("online", update);
  window.addEventListener("offline", update);
  update();
}

/* =========================================================
   31. BOOT SEQUENCE
========================================================= */
async function boot(){
  ToastManager.init();
  SettingsStore.load();
  await Promise.all([FavoritesStore.load(), PlaylistStore.load(), HistoryStore.loadAll()]);
  registerRoutes();
  bindUI();
  GestureManager.init();
  MediaSessionManager.init();
  bindNetworkStatus();
  Router.init();

  // Restore last track metadata (never autoplay without interaction)
  const lastTrack = storage.getPref("lastTrack", null);
  if(lastTrack){
    AppState.currentTrack = lastTrack;
    Renderer.updateMiniPlayer();
    document.getElementById("miniPlayer").hidden = false;
    document.getElementById("miniPlay").textContent = "▶";
    ToastManager.show("Tap play to resume "+lastTrack.title);
  }

  // Persist last track periodically
  setInterval(()=>{
    if(AppState.currentTrack) storage.setPref("lastTrack", AppState.currentTrack);
  }, 8000);

  window.addEventListener("beforeunload", ()=>{
    if(AppState.currentTrack) storage.setPref("lastTrack", AppState.currentTrack);
  });
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

})();
